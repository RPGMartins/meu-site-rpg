<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <style>
    /* ================= RESET ================= */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #ccc;
  font-family: "Segoe UI", Arial, sans-serif;
}

/* ================= PÁGINA ================= */
.page {
  width: 210mm;
  height: 297mm;
  margin: auto;
  background: #fff;
  padding: 14mm;

  display: flex;
  flex-direction: column;
}

/* ================= HEADER ================= */
.sheet-header {
  border-bottom: 2px solid #000;
  margin-bottom: 10px;
  padding-bottom: 6px;
}

.char-name {
  margin: 0;
  font-size: 1.6rem;
}

.char-meta {
  display: flex;
  gap: 20px;
  font-size: 0.95rem;
}

/* ================= BLOCOS ================= */
.block {
  padding: 6px 4px;
}

.block h2 {
  margin: 0 0 6px 0;
  font-size: 1.1rem;
  border-bottom: 1px solid #444;
}

/* ================= TEXTO ================= */
.block p {
  margin: 4px 0;
  font-size: 0.9rem;
  line-height: 1.4;
}

/* ================= SUB-ENTRADAS (sem nível) ================= */
.class-sub-entry {
  margin: 4px 0 4px 24px;
  padding-left: 10px;
  border-left: 2px solid #666;
  font-size: 0.88rem;
  color: #222;
}

/* ================= LISTAS ================= */
ul {
  padding-left: 18px;
  margin: 4px 0 0 0;
}

li {
  font-size: 0.9rem;
  line-height: 1.35;
}

/* ================= ESPAÇADOR ================= */
.spacer {
  flex: 1;
}

/* ================= PESOS ================= */
.class {
  flex: 4;
}

.race {
  flex: 3;
}

.background {
  flex: 2;
}

.feats {
  flex: 3;
}

/* ================= PRINT ================= */
@media print {
  body {
    background: none;
  }

  .page {
    margin: 0;
  }
}

.trait-box {
  border: 1px solid #444;
  border-radius: 4px;
  padding: 8px 10px;
  background: #fafafa;
}

.trait-box p {
  margin: 4px 0;
}

.bg-section {
  margin-bottom: 10px;
}

.bg-section h3 {
  margin: 6px 0 4px;
  font-size: 1rem;
  border-bottom: 1px solid #666;
}

.bg-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}

.bg-table th,
.bg-table td {
  border: 1px solid #444;
  padding: 4px 6px;
}

.bg-table th {
  background: #eee;
  text-align: center;
}

/* ===== FEATS ===== */

.feat-block {
  border: 1px solid #555;
  border-radius: 6px;
  padding: 8px 10px;
  margin-bottom: 10px;
  background: #f8f8f8;
}

.feat-block h3 {
  margin: 0 0 6px 0;
  font-size: 1rem;
  border-bottom: 1px solid #aaa;
  padding-bottom: 3px;
}

.feat-sub {
  margin-left: 12px;
  margin-top: 4px;
}

.feat-list {
  margin: 6px 0 6px 18px;
  padding: 0;
}

.feat-item {
  margin-top: 4px;
}
/* ===== SUBCLASSE ===== */

.subclass-block {
  margin-top: 10px;
  padding: 8px;
  border: 2px dashed #555;
  border-radius: 6px;
  background: #fafafa;
}

.subclass-block h2 {
  margin: 0 0 6px 0;
  font-size: 1.15rem;
  border-bottom: 1px solid #777;
}



  </style>

  <meta charset="UTF-8" />
  <title>Ficha de Personagem</title>
  <link rel="stylesheet" href="ficha.css" />
</head>
<body>

<div class="page">

  <!-- ===== TOPO ===== -->
  <header class="sheet-header">
    <h1 class="char-name">Nome do Personagem</h1>
    <div class="char-meta">
    </div>
  </header>

  <!-- ===== CLASSE ===== -->
  <section class="block class">
    <p>
        <span><strong>Classe:</strong> {{CLASSE}}</span>
    </p>
  </section>

  <div class="spacer"></div>

  <!-- ===== CLASSE ===== -->
  <section class="block subclass">
    <p>
        <span><strong>SubClasse:</strong> {{SUBCLASSE}}</span>
    </p>
  </section>

  <div class="spacer"></div>

  <!-- ===== RAÇA ===== -->
  <section class="block race">
    <p>
        <span><strong>Raça:</strong> {{RACA}}</span>
    </p>
  </section>

  <div class="spacer"></div>

  <!-- ===== BACKGROUND ===== -->
  <section class="block background">
    <p>
        <span><strong>Background:</strong> {{BACKGROUND}}</span>
    </p>
  </section>

  <div class="spacer"></div>

  <!-- ===== FEATS ===== -->
  <section class="block feats">
    <p>
        <span><strong>Feats:</strong> {{FEATS}}</span>
    </p>
  </section>

</div>

</body>
</html>
