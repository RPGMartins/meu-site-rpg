<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>RPG Builder</title>
  <link rel="stylesheet" href="sections.css">
  <link rel="stylesheet" href="overlay.css">

</head>
<body>

<div id="homebrewOverlay" class="overlay hidden">
  <div class="overlay-content">

    <button class="overlay-close" id="closeHomebrewOverlay">
      ✕
    </button>

    <h2>Gerenciar Homebrews</h2>

    <div class="field">
      <label for="homebrewSelect">Homebrews carregadas</label>
      <select id="homebrewSelect"></select>
    </div>

    <div class="homebrew-actions">
      <button id="btnImportHomebrewOverlay">Importar Homebrew</button>
      <button id="btnRemoveHomebrew" disabled>Remover Homebrew</button>
    </div>

    <!-- input invisível -->
    <input type="file" id="homebrewFileInput" accept=".json" hidden />
  </div>
</div>

  <!-- CLASS -->
<section class="panel">
  <h2 class="panel-title panel-title-row">
<div class="class-controls">
  <div class="field">
    <label for="EditionSelect"></label>
    <select id="EditionSelect"></select>
  </div>
    <button id="btnSave"class="btn-primary">Salvar</button>
<button id="btnLoad"class="btn-primary">Carregar</button>
<button id="btnManageHomebrew" class="btn-homebrew">
  🧪 Homebrew
</button>

</button>
</div>
  </h2>

<section class="panel">
  <h2 class="panel-title panel-title-row">
  <span>Classes</span>
  <div class="panel-actions">
    <button id="btnClassDetails" class="btn-view">👁 Classe</button>
    <button id="btnSubClassDetails" class="btn-view">👁 Subclasse</button>
  </div>
</h2>

    <div class="field">
      <label for="sourceSelect">Fonte</label>
      <select id="sourceSelect"></select>
    </div>

    <div class="field">
      <label for="classSelect">Classe</label>
      <select id="classSelect"></select>
    </div>


    <div class="field">
      <label for="subclassSelect">Subclasse</label>
      <select id="subclassSelect"></select>
    </div>
  </div>

  <div id="classInfo" class="class-info"></div>
</section>

  <!-- RACES -->

<section class="panel">
  <h2 class="panel-title panel-title-row">
  <span>Races</span>
  <div class="panel-actions">
    <button id="btnRaceDetails"  class="btn-view">👁 Races</button>
  </div>
  </h2>

    <div class="field">
      <label for="raceSourceSelect">Fonte</label>
      <select id="raceSourceSelect"></select>
    </div>

    <div class="field">
      <label for="raceSelect">Raça</label>
      <select id="raceSelect"></select>
    </div>

    <div class="field">
      <label for="subRaceSelect">Sub-raça</label>
      <select id="subRaceSelect"></select>
    </div>
  </div>

  <div id="raceInfo" class="class-info"></div>
</section>


  <!-- BACKGROUND -->

<section class="panel">
  <h2 class="panel-title panel-title-row">
  <span>Backgrounds</span>
  <div class="panel-actions">
    <button id="btnBackgroundDetails"  class="btn-view">👁 Backgrounds</button>
  </div>
  </h2>
  

    <div class="field">
      <label for="bgSourceSelect">Fonte</label>
      <select id="bgSourceSelect"></select>
    </div>

    <div class="field">
      <label for="bgSelect">Background</label>
      <select id="bgSelect"></select>
    </div>
  </div>

  <div id="backgroundInfo" class="class-info"></div>
</section>

  <!-- FEATS -->

<section class="panel">
  <h2 class="panel-title panel-title-row">
  <span>Feats</span>
  <div class="panel-actions">
    <button id="btnFeatsDetails"  class="btn-view">👁 Feats</button>
  </div>
  </h2>


    <div class="field">
      <label for="featSourceSelect">Fonte</label>
      <select id="featSourceSelect"></select>
    </div>

    <div class="field">
      <label for="featSelect">
        Feats
        <small>(Ctrl / Shift para múltiplos)</small>
      </label>
      <select id="featSelect" multiple size="8"></select>
    </div>
  </div>

  <div id="featInfo" class="class-info"></div>
</section>



  <!-- SCRIPTS -->
  <script type="module" src="js/main.js"></script>
<!-- ===== OVERLAY / MODAL ===== -->

  <div id="classOverlay" class="overlay hidden">
    <div class="overlay-content">

    <button class="overlay-close" id="closeClassOverlay">
      ✕
    </button>

    <h2 id="overlayTitle">Classe</h2>

    <div id="overlayBody">
      <!-- Conteúdo dinâmico -->
    </div>

    </div>
  </div>

  

</body>
</html>
