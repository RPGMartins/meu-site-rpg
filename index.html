<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>RPG Builder</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="sections.css">

</head>
<body>
<header>
  <nav>
    <div id = "HeaderEscolhas">
          <div id = "HeaderClasse"></div>
          <div id = "HeaderRaca"></div>
          <div id = "HeaderFeats"></div>
          <div id = "headerBackground"></div>

        <button onclick="exportCharacter()">
          Exportar Personagem
        </button>
    </div>
  </nav>
</header>



<!-- ================== RAÇA ================== -->
<div class="section">
  <div id="raceToggle" class="section-header" onclick="toggleSection('raceSection')">
    <span class="arrow">▶</span> Raça
  </div>
  <div id="raceSection" class="section-body">
    <div id="raceGeneral"></div>

    <!-- SUB-RAÇA -->
    <div class="section nested">
      <div class="section-header" onclick="toggleSection('subRaceSection')">
        <span class="arrow">▶</span> Sub-Raça
      </div>
      <div id="subRaceSection" class="section-body">
        <div id="raceSub"></div>
      </div>
    </div>

    <div id="raceInfo"></div>
  </div>
</div>

<!-- ================== CLASSE ================== -->
<div class="section">
  <div class="section-header" onclick="toggleSection('classSection')">
    <span class="arrow">▶</span> Classe
  </div>
  <div id="classSection" class="section-body">
    <div id="classGeneral"></div>

    <!-- SUBCLASSE -->
    <div class="section nested">
      <div class="section-header" onclick="toggleSection('subClassSection')">
        <span class="arrow">▶</span> Subclasse
      </div>
      <div id="subClassSection" class="section-body">
        <div id="classSub"></div>
      </div>
    </div>

    <div id="classInfo"></div>
    <div id="subClassInfo"></div>
    
  </div>
</div>

<!-- ================== BACKGROUND ================== -->
<div class="section">
  <div class="section-header" onclick="toggleSection('backgroundSection')">
    <span class="arrow">▶</span> Background
  </div>
  <div id="backgroundSection" class="section-body">
    <div id="backgroundContainer"></div>
    <div id="backgroundInfo"></div>
  </div>
</div>

<!-- ================== FEATS ================== -->
<div class="section">
  <div class="section-header" onclick="toggleSection('featsSection')">
    <span class="arrow">▶</span> Feats
  </div>
  <div id="featsSection" class="section-body">
    <div id="featControls"></div>
    <div id="featContainer"></div>
  </div>
</div>

  <!-- BASE 5E TOOLS -->
  <script src="./js/parser.js"></script>

  <!-- SEU CÓDIGO -->
  <script src="js/ExtraUtils.js"></script>
  <script src="js/HeaderLoader.js"></script>
  <script src="js/ExportCharacter"></script>
  <script src="js/ui.js"></script>


  <script src="js/ClassLoader.js"></script>
  <script src="js/SubClassLoader.js"></script>
  <script src="./js/RaceLoader.js"></script>
  <script src="./js/FeatLoader.js"></script>
  <script src="./js/BackgroundLoader.js"></script>


</body>
</html>
