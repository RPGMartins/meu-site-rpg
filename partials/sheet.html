<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Ficha D&D 5e</title>
    <link rel="stylesheet" href="../css/sheet.css">
</head>

<body>

<form class="charsheet">

    <!-- ================= HEADER ================= -->
    <header>
        <section class="charname">
            <label>Nome do Personagem</label>
            <input placeholder="{{nomePersonagem}}">
        </section>

        <section class="misc">
            <ul>
                <li><label>Classe & Nível</label><input placeholder="{{classeNivel}}"></li>
                <li><label>Antecedente</label><input placeholder="{{antecedente}}"></li>
                <li><label>Jogador</label><input placeholder="{{jogador}}"></li>
                <li><label>Raça</label><input placeholder="{{raca}}"></li>
                <li><label>Alinhamento</label><input placeholder="{{alinhamento}}"></li>
                <li><label>XP</label><input placeholder="{{xp}}"></li>
            </ul>
        </section>
    </header>

    <!-- ================= MAIN ================= -->
    <main>

        <!-- ================= ATTRIBUTES ================= -->
        <section class="attributes-horizontal">

            <!-- FORÇA -->
            <div class="attribute" data-ability="str">
                <input type="checkbox" class="save-prof">
                <label>Força</label>
                <input class="score" placeholder="10">
                <input class="mod" placeholder="+0">

                <div class="skills">
                    <label class="skill">
                        <input type="checkbox"> Atletismo
                    </label>
                </div>
            </div>

            <!-- DESTREZA -->
            <div class="attribute" data-ability="dex">
                <input type="checkbox" class="save-prof">
                <label>Destreza</label>
                <input class="score" placeholder="10">
                <input class="mod" placeholder="+0">

                <div class="skills">
                    <label class="skill"><input type="checkbox"> Acrobacia</label>
                    <label class="skill"><input type="checkbox"> Prestidigitação</label>
                    <label class="skill"><input type="checkbox"> Furtividade</label>
                </div>
            </div>

            <!-- CONSTITUIÇÃO -->
            <div class="attribute" data-ability="con">
                <input type="checkbox" class="save-prof">
                <label>Constituição</label>
                <input class="score" placeholder="10">
                <input class="mod" placeholder="+0">
                <div class="skills"></div>
            </div>

            <!-- INTELIGÊNCIA -->
            <div class="attribute" data-ability="int">
                <input type="checkbox" class="save-prof">
                <label>Inteligência</label>
                <input class="score" placeholder="10">
                <input class="mod" placeholder="+0">

                <div class="skills">
                    <label class="skill"><input type="checkbox"> Arcanismo</label>
                    <label class="skill"><input type="checkbox"> História</label>
                    <label class="skill"><input type="checkbox"> Investigação</label>
                    <label class="skill"><input type="checkbox"> Natureza</label>
                    <label class="skill"><input type="checkbox"> Religião</label>
                </div>
            </div>

            <!-- SABEDORIA -->
            <div class="attribute" data-ability="wis">
                <input type="checkbox" class="save-prof">
                <label>Sabedoria</label>
                <input class="score" placeholder="10">
                <input class="mod" placeholder="+0">

                <div class="skills">
                    <label class="skill"><input type="checkbox"> Adestrar Animais</label>
                    <label class="skill"><input type="checkbox"> Intuição</label>
                    <label class="skill"><input type="checkbox"> Medicina</label>
                    <label class="skill"><input type="checkbox"> Percepção</label>
                    <label class="skill"><input type="checkbox"> Sobrevivência</label>
                </div>
            </div>

            <!-- CARISMA -->
            <div class="attribute" data-ability="cha">
                <input type="checkbox" class="save-prof">
                <label>Carisma</label>
                <input class="score" placeholder="10">
                <input class="mod" placeholder="+0">

                <div class="skills">
                    <label class="skill"><input type="checkbox"> Atuação</label>
                    <label class="skill"><input type="checkbox"> Enganação</label>
                    <label class="skill"><input type="checkbox"> Intimidação</label>
                    <label class="skill"><input type="checkbox"> Persuasão</label>
                </div>
            </div>


        </section>

        <!-- ================= COMBAT ================= -->
        <section class="combat">

            <div class="combat-box prof">
                <label>Bônus Prof.</label>
                <input placeholder="{{bonusProficiencia}}">
            </div>

            <div class="combat-box">
                <label>Iniciativa</label>
                <input placeholder="{{iniciativa}}">
            </div>

            <div class="combat-box hp">
                <label>Vida - {{vida}}</label>
                <div class="hp-row">
                    <div>
                        <span>Máx</span>
                    </div>
                    <div>
                        <span>Atual</span>
                    </div>
                    <div>
                        <span>Temp</span>
                    </div>
                </div>
            </div>

            <div class="combat-box">
                <label>CA</label>
                <input placeholder="{{classeArmadura}}">
            </div>

            <div class="combat-box">
                <label>Desloc.</label>
                <input placeholder="{{deslocamento}}">
            </div>

            <div class="combat-box">
                <label>CD Magia</label>
                <input placeholder="{{cdMagia}}">
            </div>

        </section>

        <!-- ================= DEATH SAVES (SEM TEMPLATE) ================= -->
        <section class="death-saves">
            <div class="death-card">
                <label>Testes contra a Morte</label>

                <div class="death-columns">
                    <div class="death-col success">
                        <span>Sucessos</span>
                        <label><input type="checkbox"></label>
                        <label><input type="checkbox"></label>
                        <label><input type="checkbox"></label>
                    </div>

                    <div class="death-col failure">
                        <span>Falhas</span>
                        <label><input type="checkbox"></label>
                        <label><input type="checkbox"></label>
                        <label><input type="checkbox"></label>
                    </div>
                </div>
            </div>
        </section>

        <!-- ================= ATAQUES (SEM TEMPLATE) ================= -->
        <section class="attacks">
            <label>Ataques</label>
            <div class="attacks-box"></div>
        </section>

        <!-- ================= PROFICIÊNCIAS ================= -->
        <section class="proficiencies">
            <label>Proficiências</label>

            <div class="prof-grid">

                <div class="prof-block">
                    <span>Armas</span>
                    <textarea placeholder="{{proficienciasArmas}}"></textarea>
                </div>

                <div class="prof-block">
                    <span>Armaduras</span>
                    <textarea placeholder="{{proficienciasArmaduras}}"></textarea>
                </div>

                <div class="prof-block">
                    <span>Ferramentas</span>
                    <textarea placeholder="{{proficienciasFerramentas}}"></textarea>
                </div>

                <div class="prof-block">
                    <span>Idiomas</span>
                    <textarea placeholder="{{idiomas}}"></textarea>
                </div>

                <div class="prof-block full">
                    <span>Resistências, Imunidades & Outras</span>
                    <textarea placeholder="{{outrasProficiencias}}"></textarea>
                </div>

            </div>
        </section>

    </main>

</form>

</body>
</html>
